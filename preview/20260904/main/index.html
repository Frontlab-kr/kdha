<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/kdha/assets/css/datepicker.css" />
    <link rel="stylesheet" href="/kdha/assets/css/style.css" />

    <title>대표 사이트 메인 수정 | 대한치과위생사협회 시안</title>
    <script src="/kdha/assets/js/preview.js" defer></script>
  </head>
  <body class="preview-viewer preview-viewer--pc">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <header class="preview-toolbar">
      <a href="/kdha/preview/">시안 목록</a>
      <strong>대표 사이트 메인 수정</strong>
      <span>1920px</span>
    </header>
    <main id="main-content" class="preview-canvas preview-fade" data-preview-fade>
      <h1 class="sr-only">대한치과위생사협회 대표 사이트 메인 수정 시안</h1>
      <span class="sr-only" aria-live="polite" data-preview-status></span>
      <button
        class="preview-fade__stage"
        id="preview-main-stage"
        type="button"
        aria-label="다음 시안 보기"
        data-preview-next
      >
        <img
          class="preview-fade__image is-active"
          src="/kdha/assets/preview/20260904/main/a-1-20260908@2x.png"
          width="1920"
          alt="A안 치과위생사의 하루 키비주얼 1 전체 시안"
          data-preview-image="a-1"
        />
        <img
          class="preview-fade__image"
          src="/kdha/assets/preview/20260904/main/a-2-20260908@2x.png"
          width="1920"
          alt="A안 치과위생사의 하루 키비주얼 2 전체 시안"
          data-preview-image="a-2"
        />
        <img
          class="preview-fade__image"
          src="/kdha/assets/preview/20260904/main/a-3-20260908@2x.png"
          width="1920"
          alt="A안 치과위생사의 하루 키비주얼 3 전체 시안"
          data-preview-image="a-3"
        />
        <img
          class="preview-fade__image"
          src="/kdha/assets/preview/20260904/main/a-4-20260908@2x.png"
          width="1920"
          alt="A안 치과위생사의 하루 키비주얼 4 전체 시안"
          data-preview-image="a-4"
        />
        <img
          class="preview-fade__image"
          src="/kdha/assets/preview/20260904/main/b-1-20260908@2x.png"
          width="1920"
          alt="B안 국민 구강건강과 함께하는 치과위생사 키비주얼 1 전체 시안"
          data-preview-image="b-1"
        />
        <img
          class="preview-fade__image"
          src="/kdha/assets/preview/20260904/main/b-2-20260908@2x.png"
          width="1920"
          alt="B안 국민 구강건강과 함께하는 치과위생사 키비주얼 2 전체 시안"
          data-preview-image="b-2"
        />
        <img
          class="preview-fade__image"
          src="/kdha/assets/preview/20260904/main/b-3-20260908@2x.png"
          width="1920"
          alt="B안 국민 구강건강과 함께하는 치과위생사 키비주얼 3 전체 시안"
          data-preview-image="b-3"
        />
        <img
          class="preview-fade__image"
          src="/kdha/assets/preview/20260904/main/b-4-20260908@2x.png"
          width="1920"
          alt="B안 국민 구강건강과 함께하는 치과위생사 키비주얼 4 전체 시안"
          data-preview-image="b-4"
        />
      </button>
    </main>
  </body>
</html>
