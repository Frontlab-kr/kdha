<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원정보 입력 화면으로 이동</title>
    <script>
      var target = new URL(window.location.href);
      var type = target.searchParams.get("type");
      if (!["dental", "student", "general"].includes(type)) type = "dental";
      target.pathname = target.pathname.replace(/(?:\/index\.html|\/)$/, "") + "/" + type + "/";
      window.location.replace(target.href);
    </script>
  </head>
  <body>
    <h1>회원정보 입력</h1>
    <a href="/kdha/account/join/information/dental/">치과위생사회원 정보입력으로 이동</a>
  </body>
</html>
