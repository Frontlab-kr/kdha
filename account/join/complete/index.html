<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/kdha/assets/css/datepicker.css" />
    <link rel="stylesheet" href="/kdha/assets/css/style.css" />

    <title>가입완료 | 회원가입</title>
  </head>
  <body class="account-site account-join-page">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <main id="main-content" class="account-login account-join">
      <div class="account-login__shell">
        <header class="account-login__brand">
          <img src="/kdha/assets/brand/logo-header-b.svg" width="220" height="42" alt="대한치과위생사협회" />
          <span>KDHA 통합 회원서비스</span>
        </header>

        <div class="account-join__main">
          <section class="account-join__card" aria-labelledby="join-title">
            <ol class="account-join-steps account-join-steps--5" aria-label="회원가입 진행 단계">
              <li class="is-complete">
                <b>회원유형선택</b>
                <span aria-hidden="true"></span>
              </li>
              <li class="is-complete">
                <b>약관동의</b>
                <span aria-hidden="true"></span>
              </li>
              <li class="is-complete">
                <b>본인인증</b>
                <span aria-hidden="true"></span>
              </li>
              <li class="is-complete">
                <b>회원정보입력</b>
                <span aria-hidden="true"></span>
              </li>
              <li class="is-current">
                <b>가입완료</b>
                <span aria-hidden="true"></span>
              </li>
            </ol>
            <div class="account-mobile-progress" aria-label="가입완료 진행 단계: 5단계 중 5단계">
              <div class="account-mobile-progress__heading">
                <strong>가입완료</strong>
                <span>5 / 5</span>
              </div>
              <ol class="account-mobile-progress__dots" aria-hidden="true">
                <li class="is-complete"></li>
                <li class="is-complete"></li>
                <li class="is-complete"></li>
                <li class="is-complete"></li>
                <li class="is-current"></li>
              </ol>
            </div>

            <div class="account-join-complete">
              <div class="account-join-complete__heading">
                <img
                  class="account-join-complete__icon"
                  src="/kdha/assets/account/join/complete-check.png"
                  width="48"
                  height="48"
                  alt=""
                />
                <header class="account-join__heading account-join__heading--center">
                  <h1 id="join-title">회원가입 완료</h1>
                  <p>회원가입이 완료되었습니다.</p>
                </header>
              </div>
              <div class="account-join-complete__id">
                <span>아이디</span>
                <strong>kdha0101</strong>
              </div>
              <div class="account-join__actions">
                <a class="ds-button ds-button--outline ds-button--large" href="/kdha/main/">홈으로</a>
                <a class="ds-button ds-button--primary ds-button--large" href="/kdha/account/login/">로그인하기</a>
              </div>
              <ul class="ds-guide-list">
                <li class="ds-guide-list__item">
                  <span class="ds-guide-list__content">
                    정회원 전환을 위한 결제 금액은 로그인 후
                    <span class="ds-joined-text">
                      <span class="ds-link-group">
                        <a
                          class="ds-link ds-link--text ds-link--medium"
                          href="/kdha/mypage/member/grade/"
                          aria-label="회원등급관리로 이동"
                        >
                          마이페이지
                        </a>
                        <span class="ds-link-group__suffix"></span>
                      </span>

                      <span>에서</span>
                    </span>
                    확인하실 수 있습니다.
                  </span>
                </li>
              </ul>
            </div>
          </section>
          <p class="account-login__copyright">
            <span class="account-login__copyright-pc">
              © Korean Dental Hygienists Association. All rights reserved.
            </span>
            <span class="account-login__copyright-mobile">© Korean Dental Hygienists Association</span>
          </p>
        </div>
      </div>
    </main>
    <script src="/kdha/assets/js/vendor/jquery.js"></script>

    <script src="/kdha/assets/js/common.js"></script>
  </body>
</html>
