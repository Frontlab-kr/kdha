<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/kdha/assets/css/swiper.css" />
    <link rel="stylesheet" href="/kdha/assets/css/style.css" />

    <title>대한치과위생사협회</title>
  </head>
  <body class="">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <main id="main-content" class="foundation-page foundation-page--compact foundation-page--shadow">
      <header class="system-header">
        <h1 class="system-header__title">Shadow (그림자)</h1>
        <p class="system-header__description">
          컴포넌트의 깊이와 계층 구조를 표현하기 위한 시각적 효과입니다.
          <br />
          일관된 Shadow 토큰을 사용하여 UI 요소의 강조와 상태를 명확하게 전달합니다.
        </p>
      </header>
      <div class="effect-stage effect-stage--shadow">
        <article class="shadow-card" style="box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 10px">
          <strong>Shadow-SM</strong>
          <span>X : 0, Y : 4, Blur : 10 / black 20%</span>
        </article>
        <article class="shadow-card" style="box-shadow: rgba(0, 0, 0, 0.1) 0px 10px 30px">
          <strong>Shadow-MD</strong>
          <span>X : 0, Y : 10, Blur : 30 / black 10%</span>
        </article>
        <article class="shadow-card" style="box-shadow: rgba(0, 0, 0, 0.15) 0px 20px 40px">
          <strong>Shadow-LG</strong>
          <span>X : 0, Y : 20, Blur : 40 / black 15%</span>
        </article>
      </div>
    </main>
    <script src="/kdha/assets/js/vendor/jquery.js"></script>
    <script src="/kdha/assets/js/vendor/swiper.js"></script>
    <script src="/kdha/assets/js/vendor/datepicker.js"></script>
    <script src="/kdha/assets/js/vendor/datepicker-ko.js"></script>
    <script src="/kdha/assets/js/common.js"></script>
  </body>
</html>
