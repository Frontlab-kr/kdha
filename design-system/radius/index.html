<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/kdha/assets/css/swiper.css" />
    <link rel="stylesheet" href="/kdha/assets/css/style.css" />

    <title>대한치과위생사협회</title>
  </head>
  <body class="">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <main id="main-content" class="foundation-page foundation-page--compact foundation-page--radius">
      <header class="system-header">
        <h1 class="system-header__title">Radius (모서리 반경)</h1>
        <p class="system-header__description">
          컴포넌트의 모서리 곡률을 정의하는 디자인 시스템의 핵심 요소입니다.
          <br />
          일관된 Radius 토큰을 사용하여 다양한 UI 요소의 형태와 브랜드 이미지를 유지합니다.
        </p>
      </header>
      <div class="effect-stage effect-stage--radius">
        <article class="radius-card" style="border-radius: 8px">
          <strong>Radius-8</strong>
          <span>8px</span>
        </article>
        <article class="radius-card" style="border-radius: 16px">
          <strong>Radius-16</strong>
          <span>16px</span>
        </article>
        <article class="radius-card" style="border-radius: 24px">
          <strong>Radius-24</strong>
          <span>24px</span>
        </article>
        <article class="radius-card" style="border-radius: 32px">
          <strong>Radius-32</strong>
          <span>32px</span>
        </article>
        <article class="radius-card radius-card--full" style="border-radius: 999px">
          <strong>Radius-Full</strong>
          <span>999px</span>
        </article>
      </div>
    </main>
    <script src="/kdha/assets/js/vendor/jquery.js"></script>
    <script src="/kdha/assets/js/vendor/swiper.js"></script>
    <script src="/kdha/assets/js/vendor/datepicker.js"></script>
    <script src="/kdha/assets/js/vendor/datepicker-ko.js"></script>
    <script src="/kdha/assets/js/common.js"></script>
  </body>
</html>
